name: Update Market Screeners
on:
  schedule:
    - cron: '30 22 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python screener.py
      - run: python kr_screener.py
        if: always()
      - run: python news.py
        if: always()
      - name: Save data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json data/kr/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh market data'
            git push
          fi
